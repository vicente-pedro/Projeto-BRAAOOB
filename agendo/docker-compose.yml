services:
  mysql:
    image: mysql:8.0
    container_name: agendo-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: agendo
      MYSQL_DATABASE: agendo
    volumes:
      - agendo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pagendo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agendo_mysql_data:
